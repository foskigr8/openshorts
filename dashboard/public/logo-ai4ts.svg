<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Ai4Ts">
  <!--
    The Ai4Ts mark, drawn as vector so it stays sharp from a 16px favicon up to
    the nav badge, and so it has no white plate around it on a dark surface.

    Mark only, no wordmark: at 16px the letters would be mud. The planet and
    its ring are the recognisable part.

    The ring is near-black like the original, with a hairline light edge —
    on a dark interface a pure black ring simply disappears.
  -->
  <defs>
    <radialGradient id="a4t-planet" cx="34%" cy="26%" r="78%">
      <stop offset="0%" stop-color="#ff4d4d"/>
      <stop offset="42%" stop-color="#ef1b1b"/>
      <stop offset="100%" stop-color="#5c0a0a"/>
    </radialGradient>
    <linearGradient id="a4t-ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#000"/>
    </linearGradient>
    <clipPath id="a4t-top">
      <!-- Everything above the ring's centre line: the half the ring passes behind. -->
      <rect x="0" y="0" width="64" height="33"/>
    </clipPath>
  </defs>

  <!-- the body -->
  <circle cx="31" cy="33" r="19" fill="url(#a4t-planet)"/>

  <!-- ring, behind the planet's upper half -->
  <g clip-path="url(#a4t-top)">
    <ellipse cx="32" cy="33" rx="30" ry="9.5"
             transform="rotate(-21 32 33)"
             fill="none" stroke="url(#a4t-ring)" stroke-width="7"/>
    <ellipse cx="32" cy="33" rx="30" ry="9.5"
             transform="rotate(-21 32 33)"
             fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="0.9"/>
  </g>

  <!-- ring, in front of the planet's lower half -->
  <path d="M 2.9 39.6 A 30 9.5 -21 0 0 61.1 26.4"
        transform="rotate(-21 32 33)"
        fill="none" stroke="url(#a4t-ring)" stroke-width="7" stroke-linecap="round"/>
  <path d="M 2.9 39.6 A 30 9.5 -21 0 0 61.1 26.4"
        transform="rotate(-21 32 33)"
        fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="0.9" stroke-linecap="round"/>

  <!-- the spark, top right, as in the original -->
  <path d="M46 8 L48.1 14.2 L54 16.5 L48.1 18.8 L46 25 L43.9 18.8 L38 16.5 L43.9 14.2 Z"
        fill="#0d0d0d" stroke="rgba(255,255,255,0.25)" stroke-width="0.7" stroke-linejoin="round"/>
</svg>
