<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Ai4Ts">
  <!--
    A hand-drawn stand-in for the Ai4Ts mark, not the artwork itself: this
    toolchain cannot author a binary, so the real PNG has to be copied into
    public/logo-ai4ts.png by hand — brand.js prefers it the moment it exists
    and this file stops being used.

    Kept faithful to the original's structure: red planet under a black
    orbital band tilted up to the right, two sparkles above it, and the
    wordmark riding the band's angle in outlined block letters with a red
    offset shadow.
  -->
  <defs>
    <radialGradient id="planet" cx="42%" cy="22%" r="82%">
      <stop offset="0%" stop-color="#ff1a1a"/>
      <stop offset="45%" stop-color="#e60000"/>
      <stop offset="78%" stop-color="#8c0505"/>
      <stop offset="100%" stop-color="#2b0202"/>
    </radialGradient>

    <!-- The band: a wide flat ellipse with its middle cut out, so it reads as
         a ring rather than a blob, with the ends running off past the planet. -->
    <mask id="band-mask">
      <rect width="512" height="512" fill="black"/>
      <ellipse cx="256" cy="248" rx="228" ry="74" fill="white"/>
      <ellipse cx="256" cy="248" rx="196" ry="44" fill="black"/>
    </mask>

    <!-- Upper half of the frame: where the band passes BEHIND the planet. -->
    <clipPath id="above">
      <rect x="0" y="0" width="512" height="252"/>
    </clipPath>
  </defs>

  <g transform="rotate(-19 256 256)">
    <!-- band, behind -->
    <g clip-path="url(#above)">
      <rect width="512" height="512" fill="#050505" mask="url(#band-mask)"/>
    </g>
  </g>

  <!-- the planet -->
  <circle cx="256" cy="256" r="132" fill="url(#planet)"/>

  <g transform="rotate(-19 256 256)">
    <!-- band, in front of the planet's lower half -->
    <g clip-path="url(#below)">
      <rect width="512" height="512" fill="#050505" mask="url(#band-mask)"/>
    </g>
  </g>
  <defs>
    <clipPath id="below">
      <rect x="0" y="252" width="512" height="260"/>
    </clipPath>
  </defs>

  <!-- sparkles: four-point stars with long concave points, as in the original -->
  <path d="M247 96 C251 124 258 131 286 135 C258 139 251 146 247 174
           C243 146 236 139 208 135 C236 131 243 124 247 96 Z" fill="#070707"/>
  <path d="M330 60 C336 104 346 114 390 120 C346 126 336 136 330 180
           C324 136 314 126 270 120 C314 114 324 104 330 60 Z" fill="#070707"/>

  <!-- wordmark: white letters, heavy black outline, red offset shadow -->
  <g transform="rotate(-13 256 268)" font-family="'Arial Black', Impact, sans-serif"
     font-size="150" font-weight="900" font-style="italic" letter-spacing="-4">
    <text x="256" y="300" text-anchor="middle" fill="#e00000"
          stroke="#e00000" stroke-width="26" stroke-linejoin="round"
          transform="translate(-7 9)">Ai4Ts</text>
    <text x="256" y="300" text-anchor="middle" fill="#ffffff"
          stroke="#000000" stroke-width="18" stroke-linejoin="round"
          paint-order="stroke fill">Ai4Ts</text>
  </g>
</svg>
